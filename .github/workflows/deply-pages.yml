name: Deploy Privacy Policy to GitHub Pages

on:
  push:
    branches: [development]
    paths:
      - 'index.html'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Cambia esto según donde esté tu index.html:
          # Si está en la raíz: '.'
          # Si está en carpeta docs: './docs'
          # Si está en otra carpeta: './nombre-carpeta'
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment Summary
        if: success()
        run: |
          echo "=========================================="
          echo "✅ GITHUB PAGES DEPLOYED SUCCESSFULLY"
          echo "=========================================="
          echo "URL: ${{ steps.deployment.outputs.page_url }}"
          echo "Branch: development"
          echo "=========================================="